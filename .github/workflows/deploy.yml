name: Auto Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm install --legacy-peer-deps

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install --legacy-peer-deps

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build

    - name: Create Deployment Summary
      run: |
        echo "## ✅ Deployment Ready" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Application Status" >> $GITHUB_STEP_SUMMARY
        echo "- Backend: Ready to run" >> $GITHUB_STEP_SUMMARY
        echo "- Frontend: Built successfully" >> $GITHUB_STEP_SUMMARY
        echo "- Database: SQLite configured" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Quick Start" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "git clone https://github.com/vinayak872/realtime-chat-app.git" >> $GITHUB_STEP_SUMMARY
        echo "cd realtime-chat-app" >> $GITHUB_STEP_SUMMARY
        echo "cd backend && npm install && npm start" >> $GITHUB_STEP_SUMMARY
        echo "cd frontend && npm install && npm run dev" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: frontend-build
        path: frontend/dist/
        retention-days: 7

    - name: Deployment Complete
      run: |
        echo "✅ Deployment workflow completed!"
        echo "✅ Frontend built and artifacts uploaded"
        echo "✅ Backend ready for deployment"
