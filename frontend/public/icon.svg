<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0B0F19"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#pulseGradient)" stroke-width="8" opacity="0.3"/>
  
  <!-- Chat Bubble -->
  <path d="M140 180 C140 135 175 100 220 100 L292 100 C337 100 372 135 372 180 L372 260 C372 305 337 340 292 340 L220 340 L160 390 L160 340 C140 330 140 310 140 260 Z" 
        fill="url(#pulseGradient)" filter="url(#glow)"/>
  
  <!-- Pulse Wave -->
  <path d="M190 220 L220 220 L235 180 L260 260 L280 200 L295 220 L322 220" 
        fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
